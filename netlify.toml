# =====================================================
# Netlify Build- und Deploy-Konfiguration
# Dennis Klincov · dennis-klincov.com
# =====================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

# Astro generiert statische HTML, daher kein Adapter nötig.
# Netlify scannt beim Build die data-netlify="true" Forms und legt
# die Submission-Pipeline automatisch an.

# =====================================================
# Security Headers
# =====================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# =====================================================
# Cache-Control für statische Assets
# =====================================================
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# =====================================================
# Redirects: alte GitHub-Pages-URLs (.html) auf neue Astro-Routes
# Damit alte Backlinks und Lesezeichen weiterhin funktionieren.
# =====================================================
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/ueber-mich.html"
  to = "/ueber-mich/"
  status = 301
  force = true

